[project]
name = "holder"
version = "0.2.0"
description = "Monitor stand column holder"
readme = "README.md"
authors = [
    { name = "w0rxbend", email = "balyszyn@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = ["build123d>=0.11,<0.12"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
